<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otaku_zone</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0B0614;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #160D25;
  padding: 25px 18px;
  border-bottom: 3px solid #8B5CF6;
}

header h1 {
  color: #A78BFA;
  margin: 0 0 12px;
  font-size: 30px;
}

header p {
  color: #D8B4FE;
  font-size: 18px;
  margin-bottom: 0;
}

main {
  padding: 20px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #8B5CF6;
  border-radius: 15px;
  background: #190F28;
  color: white;
  font-size: 16px;
  margin-bottom: 25px;
}

h2 {
  color: #D8B4FE;
}

.catalogue {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  background: #1B1028;
  border: 1px solid #39214F;
  border-radius: 17px;
  overflow: hidden;
}

.poster {
  height: 145px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #35145B, #140A20);
  font-size: 55px;
}

.details {
  padding: 12px;
}

.details h3 {
  font-size: 17px;
}

.details p {
  color: #D1C1E8;
  font-size: 13px;
  line-height: 1.5;
}

button, .watch {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 12px 5px;
  background: #8B5CF6;
  color: white;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
}

#detailsAnime {
  margin-top: 25px;
  padding: 16px;
  background: #190F28;
  border: 1px solid #8B5CF6;
  border-radius: 15px;
  display: none;
}

.season {
  background: #28163C;
  padding: 12px;
  border-radius: 10px;
  margin: 12px 0;
}

.episode {
  border-top: 1px solid #49305F;
  padding: 10px 0;
}

.back {
  background: #49305F;
}

footer {
  padding: 25px;
  text-align: center;
  color: #A78BFA;
}
</style>
</head>

<body>

<header>
  <h1>Otaku_zone 💜</h1>
  <p>Ton univers anime</p>
</header>

<main>
  <input
    type="search"
    id="search"
    placeholder="Rechercher un animé..."
    oninput="searchAnime()"
  >

  <h2>🔥 Catalogue anime</h2>

  <div class="catalogue" id="catalogue"></div>

  <section id="detailsAnime">
    <button class="back" onclick="closeAnime()">← Retour au catalogue</button>
    <h2 id="animeTitle"></h2>
    <p id="animeDescription"></p>
    <div id="seasons"></div>
  </section>
</main>

<footer>
  Otaku_zone 💜<br>
  Ton univers anime
</footer>

<script>
const animes = [
  {
    id: 1,
    title: "Demon Slayer",
    emoji: "⚔️",
    description: "Un jeune chasseur de démons.",
    seasons: []
  },
  {
    id: 2,
    title: "Attack on Titan",
    emoji: "🛡️",
    description: "L'humanité lutte pour survivre.",
    seasons: []
  },
  {
    id: 3,
    title: "One Piece",
    emoji: "🏴‍☠️",
    description: "L'aventure de Luffy et son équipage.",
    seasons: []
  }
];

function displayAnimes(list) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  list.forEach(anime => {
    catalogue.innerHTML += `
      <article class="card">
        <div class="poster">${anime.emoji}</div>
        <div class="details">
          <h3>${anime.title}</h3>
          <p>${anime.description}</p>
          <button onclick="openAnime(${anime.id})">
            Découvrir
          </button>
        </div>
      </article>
    `;
  });
}

function searchAnime() {
  const query = document.getElementById("search").value.toLowerCase();

  displayAnimes(
    animes.filter(anime =>
      anime.title.toLowerCase().includes(query)
    )
  );
}

function openAnime(id) {
  const anime = animes.find(item => item.id === id);

  document.getElementById("detailsAnime").style.display = "block";
  document.getElementById("animeTitle").textContent = anime.title;
  document.getElementById("animeDescription").textContent =
    anime.description;

  const seasons = document.getElementById("seasons");

  if (anime.seasons.length === 0) {
    seasons.innerHTML = `
      <p>Aucune saison ajoutée pour le moment.</p>
      <p>Les saisons et les épisodes seront ajoutés ici.</p>
    `;
  } else {
    seasons.innerHTML = anime.seasons.map(season => `
      <div class="season">
        <h3>${season.name}</h3>
        ${season.episodes.map(episode => `
          <div class="episode">
            <p>${episode.title}</p>
            ${
              episode.url
                ? `<a class="watch" href="${episode.url}" target="_blank" rel="noopener">▶ Regarder</a>`
                : "<p>Lien vidéo à ajouter.</p>"
            }
          </div>
        `).join("")}
      </div>
    `).join("");
  }

  document.getElementById("detailsAnime").scrollIntoView({
    behavior: "smooth"
  });
}

function closeAnime() {
  document.getElementById("detailsAnime").style.display = "none";
}

displayAnimes(animes);
</script>

</body>
</html>
