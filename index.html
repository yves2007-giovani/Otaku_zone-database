<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>Otaku_zone</title>

<style>
:root {
  --black: #0A0A0A;
  --panel: #171717;
  --gold: #D4AF37;
  --lightgold: #F5D76E;
  --white: #FFFFFF;
  --muted: #BBBBBB;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 16px;
  background: #111;
  border-bottom: 2px solid var(--gold);
}

header h1 {
  margin: 0;
  color: var(--gold);
  font-size: 28px;
}

header p { color: var(--muted); }

main { padding: 16px; }

input {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--gold);
  border-radius: 9px;
  background: var(--panel);
  color: white;
  font-size: 16px;
}

h2 { color: var(--lightgold); }

.catalogue {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.card {
  background: var(--panel);
  border: 1px solid #383020;
  border-radius: 12px;
  overflow: hidden;
}

.poster {
  width: 100%;
  height: 190px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  overflow: hidden;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info { padding: 12px; }

.info h3 { font-size: 15px; }

.info p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: var(--gold);
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

#animePage { display: none; }

.hero {
  width: 100%;
  max-height: 360px;
  overflow: hidden;
  background: #222;
  text-align: center;
}

.hero img {
  width: 100%;
  max-height: 360px;
  object-fit: contain;
}

.season {
  margin-top: 16px;
  padding: 14px;
  background: var(--panel);
  border: 1px solid #493C1B;
  border-radius: 10px;
}

.season h3 { color: var(--gold); }

.back {
  background: #292929;
  color: var(--gold);
  margin-bottom: 16px;
}

#status {
  color: var(--muted);
  line-height: 1.6;
}

.pagination {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

footer {
  padding: 25px;
  text-align: center;
  color: var(--gold);
  border-top: 1px solid #383020;
  margin-top: 30px;
}

@media (max-width: 350px) {
  .catalogue { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<header>
  <h1>Otaku_zone</h1>
  <p>Ton univers anime</p>
</header>

<main>
  <section id="home">
    <input id="search" type="search"
      placeholder="Rechercher un animé..."
      autocomplete="off">
    <h2>Catalogue anime</h2>
    <p id="status">Chargement du catalogue...</p>
    <div id="catalogue" class="catalogue"></div>

    <div class="pagination">
      <button id="previous" disabled>← Précédent</button>
      <button id="next" disabled>Suivant →</button>
    </div>
  </section>

  <section id="animePage">
    <button class="back" onclick="goHome()">← Retour au catalogue</button>
    <div id="hero" class="hero"></div>
    <h2 id="animeTitle"></h2>
    <p id="animeDescription"></p>
    <p id="animeDetails"></p>
    <h2>Saisons et épisodes</h2>
    <div id="seasonList"></div>
  </section>
</main>

<footer>Otaku_zone · Noir & doré</footer>

<script>
const API = "https://graphql.anilist.co";
const PAGE_SIZE = 20;

let page = 1;
let query = "";
let animes = [];
let searchTimer = null;
let requestNumber = 0;

const $ = id => document.getElementById(id);

async function fetchAniList() {
  const currentRequest = ++requestNumber;
  $("status").textContent = "Chargement des animés...";
  $("catalogue").innerHTML = "";
  $("previous").disabled = true;
  $("next").disabled = true;

  const gql = `
    query ($page: Int, $perPage: Int, $search: String) {
      Page(page: $page, perPage: $perPage) {
        pageInfo {
          currentPage
          hasNextPage
        }
        media(
          type: ANIME,
          sort: POPULARITY_DESC,
          search: $search
        ) {
          id
          title {
            romaji
            english
            native
          }
          coverImage {
            large
          }
          description(asHtml: false)
          episodes
          seasonYear
          format
          status
          genres
        }
      }
    }
  `;

  const variables = {
    page,
    perPage: PAGE_SIZE
  };

  if (query) variables.search = query;

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        query: gql,
        variables
      })
    });

    if (!response.ok) {
      throw new Error("Réponse HTTP " + response.status);
    }

    const result = await response.json();

    if (currentRequest !== requestNumber) return;

    if (result.errors) {
      throw new Error("L'API a refusé la requête.");
    }

    animes = result.data.Page.media || [];
    renderCatalogue();

    $("status").textContent = animes.length
      ? `${animes.length} animés affichés · Page ${page}`
      : "Aucun animé trouvé. Essaie un autre titre.";

    $("previous").disabled = page <= 1;
    $("next").disabled = !result.data.Page.pageInfo.hasNextPage;

  } catch (error) {
    if (currentRequest !== requestNumber) return;

    $("status").textContent =
      "Impossible de charger le catalogue. Vérifie ta connexion Internet et réessaie.";

    $("catalogue").innerHTML = `
      <div>
        <p>Le service AniList ne répond pas actuellement ou la connexion est bloquée.</p>
        <button onclick="fetchAniList()">Réessayer</button>
      </div>
    `;
  }
}

function renderCatalogue() {
  $("catalogue").innerHTML = animes.map(anime => {
    const title = getTitle(anime);
    const image = anime.coverImage?.large || "";

    return `
      <article class="card">
        <div class="poster">
          ${image
            ? `<img src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}" loading="lazy">`
            : "🎬"}
        </div>
        <div class="info">
          <h3>${escapeHTML(title)}</h3>
          <p>${escapeHTML(anime.seasonYear || "Année inconnue")}</p>
          <button onclick="openAnime(${Number(anime.id)})">
            Découvrir
          </button>
        </div>
      </article>
    `;
  }).join("");
}

function getTitle(anime) {
  return anime.title?.english ||
         anime.title?.romaji ||
         anime.title?.native ||
         "Anime sans titre";
}

function openAnime(id) {
  const anime = animes.find(item => Number(item.id) === Number(id));
  if (!anime) return;

  $("home").style.display = "none";
  $("animePage").style.display = "block";

  $("animeTitle").textContent = getTitle(anime);
  $("animeDescription").textContent =
    stripHTML(anime.description || "Aucune description disponible.");

  $("animeDetails").textContent = [
    anime.format ? "Format : " + anime.format : "",
    anime.episodes ? "Épisodes annoncés : " + anime.episodes : "",
    anime.seasonYear ? "Année : " + anime.seasonYear : "",
    anime.status ? "Statut : " + anime.status : "",
    anime.genres?.length ? "Genres : " + anime.genres.join(", ") : ""
  ].filter(Boolean).join(" · ");

  const image = anime.coverImage?.large || "";
  $("hero").innerHTML = image
    ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(getTitle(anime))}">`
    : "🎬";

  $("seasonList").innerHTML = `
    <div class="season">
      <p>Les informations sur les saisons et les vidéos doivent être ajoutées séparément.</p>
      <p>Aucun lecteur vidéo n'est configuré pour cet anime.</p>
    </div>
  `;

  window.scrollTo(0, 0);
}

function goHome() {
  $("animePage").style.display = "none";
  $("home").style.display = "block";
  window.scrollTo(0, 0);
}

function stripHTML(value) {
  const element = document.createElement("div");
  element.innerHTML = value;
  return element.textContent || element.innerText || "";
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

$("search").addEventListener("input", event => {
  clearTimeout(searchTimer);
  query = event.target.value.trim();
  page = 1;

  searchTimer = setTimeout(fetchAniList, 500);
});

$("previous").addEventListener("click", () => {
  if (page > 1) {
    page--;
    fetchAniList();
    window.scrollTo(0, 0);
  }
});

$("next").addEventListener("click", () => {
  page++;
  fetchAniList();
  window.scrollTo(0, 0);
});

fetchAniList();
</script>
</body>
  </html>
