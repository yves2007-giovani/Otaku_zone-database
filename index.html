<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;background:#111;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0}
main{padding:15px}
input,button{padding:12px;border:1px solid #d4af37;border-radius:8px;background:#181818;color:#fff}
input{width:100%;margin:10px 0}
button{cursor:pointer}
#status{color:#d4af37}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card h3{padding:8px;margin:0;font-size:14px}
#details{margin-top:20px;padding:12px;background:#151515;border-radius:10px}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
video{width:100%;background:#000;margin-top:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>OTAKU_ZONE</h1>
<p>Découvre ton univers anime</p>
</header><main>
<input id="search" placeholder="Rechercher un anime...">
<button id="searchBtn">Rechercher</button>
<p id="status">Chargement des animés...</p>
<div id="catalog" class="grid"></div><section id="details" hidden>
<h2 id="animeTitle"></h2>
<p id="animeInfo"></p>
<div id="episodes" class="episodes"></div>
<p id="episodeInfo"></p>
<video id="player" controls playsinline></video>
</section>
</main><script>
const API="https://mirurotvapi.vercel.app/api";
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

const $=id=>document.getElementById(id);

async function getJSON(url){
 const response=await fetch(url);
 if(!response.ok)throw Error("HTTP "+response.status);
 return response.json();
}

function titleOf(a){
 return a?.title?.english||a?.title?.romaji||a?.title||"Anime";
}

function imageOf(a){
 return a?.coverImage?.large||a?.coverImage?.medium||a?.image||"";
}

function showCatalog(list){
 $("catalog").innerHTML="";
 if(!Array.isArray(list)||!list.length){
  $("status").textContent="Aucun résultat trouvé.";
  return;
 }
 list.forEach(a=>{
  const card=document.createElement("article");
  card.className="card";
  const img=document.createElement("img");
  img.src=imageOf(a);
  img.alt=titleOf(a);
  img.loading="lazy";
  const name=document.createElement("h3");
  name.textContent=titleOf(a);
  card.append(img,name);
  card.onclick=()=>openAnime(a);
  $("catalog").appendChild(card);
 });
}

async function loadTrending(){
 try{
  $("status").textContent="Chargement...";
  const data=await getJSON(API+"/trending?per_page=24");
  showCatalog(data.results?.results||[]);
  $("status").textContent="Animés populaires";
 }catch(error){
  $("status").textContent="API indisponible : "+error.message;
 }
}

async function searchAnime(){
 const query=$("search").value.trim();
 if(!query){loadTrending();return;}
 try{
  $("status").textContent="Recherche...";
  const data=await getJSON(API+"/search?query="+encodeURIComponent(query)+"&per_page=24");
  showCatalog(data.results?.results||[]);
  $("status").textContent="Résultats de recherche";
 }catch(error){
  $("status").textContent="Recherche indisponible : "+error.message;
 }
}

async function openAnime(anime){
 $("details").hidden=false;
 $("details").scrollIntoView({behavior:"smooth"});
 $("animeTitle").textContent=titleOf(anime);
 $("animeInfo").textContent="Chargement des épisodes...";
 $("episodes").innerHTML="";
 $("episodeInfo").textContent="";
 $("player").removeAttribute("src");
 $("player").load();

 try{
  const data=await getJSON(API+"/episodes/"+encodeURIComponent(anime.id));
  const providers=data.results?.providers||{};
  const all=[];

  Object.entries(providers).forEach(([provider,info])=>{
   const languages=info.episodes||{};
   Object.entries(languages).forEach(([language,items])=>{
    if(Array.isArray(items)){
     items.forEach(ep=>all.push({...ep,provider,language}));
    }
   });
  });

  if(!all.length){
   $("animeInfo").textContent="Aucun épisode disponible.";
   return;
  }

  all.sort((a,b)=>a.number-b.number);
  $("animeInfo").textContent=all.length+" épisodes trouvés.";

  all.forEach(ep=>{
   const btn=document.createElement("button");
   btn.textContent="Ép. "+ep.number;
   btn.onclick=()=>loadEpisode(anime.id,ep);
   $("episodes").appendChild(btn);
  });
 }catch(error){
  $("animeInfo").textContent="Impossible de charger les épisodes.";
 }
}

async function loadEpisode(animeId,ep){
 $("episodeInfo").textContent="Chargement de la source...";
 try{
  const path=ep.id;
  if(!path||!path.startsWith("watch/")){
   throw Error("Identifiant d'épisode invalide");
  }
  const data=await getJSON(API+"/"+path);
  const streams=data.results?.streams||[];
  const stream=streams.find(s=>s.url);

  if(!stream)throw Error("Aucune source vidéo disponible");

  $("player").src=stream.url;
  $("player").load();
  $("episodeInfo").textContent="Si la vidéo ne démarre pas, cette source peut être indisponible.";
  $("player").play().catch(()=>{});
 }catch(error){
  $("episodeInfo").textContent="Lecture indisponible : "+error.message;
 }
}

$("searchBtn").addEventListener("click",searchAnime);
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchAnime();
});

loadTrending();
</script></body>
                                   </html>
