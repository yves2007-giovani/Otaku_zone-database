<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:24px 15px;text-align:center;background:#111;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0;font-size:30px;letter-spacing:2px}
header p{color:#aaa;margin:8px 0 0}
main{max-width:1100px;margin:auto;padding:16px}
.search{display:flex;gap:8px;margin-bottom:12px}
input,button{border:1px solid #d4af37;border-radius:8px;padding:12px;background:#181818;color:#fff}
input{width:100%;min-width:0}
button{cursor:pointer}
button:active,.active{background:#d4af37;color:#000}
#status{color:#d4af37;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #292929}
.poster{height:190px;background:linear-gradient(135deg,#222,#5b4512);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#d4af37;font-weight:bold;font-size:20px}
.card img{display:block;width:100%;height:190px;object-fit:cover}
.card h3{font-size:14px;padding:10px;margin:0}
#details{margin-top:22px;padding:14px;background:#121212;border:1px solid #333;border-radius:12px}
.hidden{display:none}
#seasons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.episodes button{padding:12px 4px}
video{display:block;width:100%;max-height:450px;background:#000;margin-top:15px}
#episodeInfo{color:#d4af37;font-size:14px}
@media(min-width:650px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.poster,.card img{height:240px}
.episodes{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
<h1>OTAKU_ZONE</h1>
<p>Ton univers anime</p>
</header>

<main>
<div class="search">
<input id="search" placeholder="Rechercher un anime...">
<button id="searchBtn">OK</button>
</div>

<p id="status">Chargement du catalogue...</p>
<div id="catalog" class="grid"></div>

<section id="details" class="hidden">
<h2 id="animeTitle"></h2>
<p id="animeInfo"></p>

<h3>Saisons</h3>
<div id="seasons"></div>

<h3>Épisodes</h3>
<div id="episodes" class="episodes"></div>

<p id="episodeInfo"></p>
<video id="player" controls playsinline></video>
</section>
</main>

<script>
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

const $=id=>document.getElementById(id);
let animes=[];
let currentAnime=null;
let currentSeason=null;

function titleOf(a){
 return a.title?.english || a.title?.romaji || a.title || "Anime";
}

function renderCatalog(list){
 const catalog=$("catalog");
 catalog.innerHTML="";

 if(!list.length){
  $("status").textContent="Aucun anime trouvé.";
  return;
 }

 $("status").textContent=list.length+" anime(s)";

 list.forEach(anime=>{
  const card=document.createElement("article");
  card.className="card";

  if(anime.image){
   const img=document.createElement("img");
   img.src=anime.image;
   img.alt=anime.title;
   img.loading="lazy";
   img.onerror=()=>{
    const fallback=document.createElement("div");
    fallback.className="poster";
    fallback.textContent=anime.title;
    img.replaceWith(fallback);
   };
   card.appendChild(img);
  }else{
   const poster=document.createElement("div");
   poster.className="poster";
   poster.textContent=anime.title;
   card.appendChild(poster);
  }

  const name=document.createElement("h3");
  name.textContent=anime.title;
  card.appendChild(name);

  card.onclick=()=>openAnime(anime);
  catalog.appendChild(card);
 });
}

async function loadDatabase(){
 try{
  const response=await fetch(DB+"?t="+Date.now());
  if(!response.ok)throw Error("HTTP "+response.status);

  const data=await response.json();
  if(!Array.isArray(data.animes))throw Error("Format JSON incorrect");

  animes=data.animes;
  renderCatalog(animes);
 }catch(error){
  console.error(error);
  $("status").textContent="Base inaccessible. Vérifie episodes.json et ta connexion.";
 }
}

function openAnime(anime){
 currentAnime=anime;
 currentSeason=null;

 $("details").classList.remove("hidden");
 $("details").scrollIntoView({behavior:"smooth"});
 $("animeTitle").textContent=anime.title;
 $("animeInfo").textContent=anime.description_fr||"Choisis une saison.";
 $("seasons").innerHTML="";
 $("episodes").innerHTML="";
 $("episodeInfo").textContent="";
 $("player").pause();
 $("player").removeAttribute("src");
 $("player").load();

 if(!Array.isArray(anime.seasons)||!anime.seasons.length){
  $("animeInfo").textContent="Aucune saison enregistrée.";
  return;
 }

 anime.seasons.forEach((season,index)=>{
  const button=document.createElement("button");
  button.textContent=season.title||"Saison "+season.number;
  button.onclick=()=>showEpisodes(season,button);
  $("seasons").appendChild(button);

  if(index===0)showEpisodes(season,button);
 });
}

function showEpisodes(season,button){
 currentSeason=season;

 document.querySelectorAll("#seasons button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");

 $("episodes").innerHTML="";
 $("episodeInfo").textContent="";

 const list=season.episodes||[];

 if(!list.length){
  $("episodeInfo").textContent="Aucun épisode enregistré.";
  return;
 }

 list.forEach(ep=>{
  const b=document.createElement("button");
  b.textContent=ep.number;
  b.title=ep.title||"Épisode "+ep.number;
  b.onclick=()=>playEpisode(ep);
  $("episodes").appendChild(b);
 });
}

function playEpisode(ep){
 const url=(ep.url||ep.vf||ep.vostfr||"").trim();

 if(!url){
  $("episodeInfo").textContent=
   "Épisode "+ep.number+" : lien vidéo manquant dans episodes.json.";
  return;
 }

 if(!/^https?:\/\//i.test(url)||/\/dl\//i.test(new URL(url).pathname)){
  $("episodeInfo").textContent=
   "Ce lien n'est pas une adresse de lecture directe.";
  return;
 }

 const player=$("player");
 player.src=url;
 player.load();
 $("episodeInfo").textContent="Épisode "+ep.number+" : chargement...";
 player.play().catch(()=>{
  $("episodeInfo").textContent=
   "Lecture impossible avec ce lien ou ce format vidéo.";
 });
 player.scrollIntoView({behavior:"smooth",block:"center"});
}

function searchAnime(){
 const q=$("search").value.trim().toLowerCase();
 renderCatalog(animes.filter(a=>
  String(a.title||"").toLowerCase().includes(q)
 ));
}

$("searchBtn").addEventListener("click",searchAnime);
$("search").addEventListener("input",searchAnime);
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchAnime();
});

loadDatabase();
</script>
</body>
  </html>
