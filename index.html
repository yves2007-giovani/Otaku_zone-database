<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{background:#111;padding:18px;border-bottom:2px solid #d6a400}
.logo{font-size:28px;font-weight:bold;color:#e8b800}
nav{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
button{background:#d6a400;color:#111;border:0;border-radius:5px;padding:11px;font-weight:bold;cursor:pointer}
input{width:100%;padding:13px;margin-top:15px;background:#222;color:white;border:1px solid #555;border-radius:6px}
main{padding:15px}
h2{color:#e8b800}
#catalogue{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:13px}
.card{background:#171717;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover}
.card p{padding:8px;margin:0;font-size:14px;font-weight:bold}
.small{padding:8px;color:#aaa;font-size:12px}
#details{display:none;background:#171717;padding:15px;margin-bottom:20px;border-radius:8px;overflow:hidden}
#details img{width:125px;float:left;margin:0 15px 10px 0}
#details:after{content:"";display:block;clear:both}
#status{color:#bbb;font-size:13px}
#more{margin-top:20px}
a{color:#e8b800}
footer{text-align:center;padding:25px;color:#888}
</style>
</head>

<body>
<header>
  <div class="logo">OTAKU_ZONE</div>

  <nav>
    <button onclick="showCatalog()">ANIMÉS</button>
    <button onclick="showTrending()">TENDANCES</button>
  </nav>

  <input id="search" placeholder="Recherche un anime..."
         onkeydown="if(event.key==='Enter')searchAnime()">

  <button style="width:100%;margin-top:10px"
          onclick="searchAnime()">RECHERCHER</button>
</header>

<main>
  <p id="status">Connexion aux API...</p>
  <section id="details"></section>

  <h2 id="heading">Animés populaires</h2>
  <div id="catalogue"></div>

  <button id="more" onclick="loadMore()" style="display:none">
    VOIR PLUS
  </button>
</main>

<footer>OTAKU_ZONE © 2026</footer>

<script>
const ANILIST_URL = "https://graphql.anilist.co";
const JIKAN_URL = "https://api.jikan.moe/v4";

let page = 1;
let currentMode = "popular";
let busy = false;

const catalogue = document.getElementById("catalogue");
const statusText = document.getElementById("status");
const details = document.getElementById("details");
const moreButton = document.getElementById("more");

const animeFields = `
  id
  idMal
  title { romaji english native }
  description(asHtml:false)
  episodes
  genres
  averageScore
  seasonYear
  format
  coverImage { large extraLarge }
  siteUrl
`;

async function anilist(query, variables = {}) {
  const response = await fetch(ANILIST_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({query, variables})
  });

  if (!response.ok) {
    throw new Error("AniList HTTP " + response.status);
  }

  const result = await response.json();

  if (result.errors) {
    throw new Error(result.errors[0].message);
  }

  return result.data;
}

async function getJikanEpisodes(anime) {
  if (anime.episodes != null) return anime.episodes;

  if (!anime.idMal) return null;

  try {
    const response = await fetch(
      JIKAN_URL + "/anime/" + anime.idMal
    );

    if (!response.ok) return null;

    const result = await response.json();
    return result.data?.episodes ?? null;
  } catch (error) {
    return null;
  }
}

async function showCatalog() {
  page = 1;
  currentMode = "popular";
  details.style.display = "none";
  document.getElementById("search").value = "";
  document.getElementById("heading").textContent = "Animés populaires";
  await loadAnime();
}

async function showTrending() {
  page = 1;
  currentMode = "trending";
  details.style.display = "none";
  document.getElementById("heading").textContent = "Animés tendance";
  await loadAnime();
}

async function loadAnime(append = false) {
  if (busy) return;

  busy = true;
  statusText.textContent = "Chargement des animés...";
  if (!append) catalogue.innerHTML = "";

  const sort = currentMode === "trending"
    ? "TRENDING_DESC"
    : "POPULARITY_DESC";

  const query = `
    query ($page:Int,$perPage:Int) {
      Page(page:$page,perPage:$perPage) {
        media(
          type:ANIME,
          sort:${sort}
        ) {
          ${animeFields}
        }
      }
    }
  `;

  try {
    const data = await anilist(query, {
      page: page,
      perPage: 24
    });

    displayAnime(data.Page.media, append);

    statusText.textContent = "Catalogue chargé.";
    moreButton.style.display = "block";
  } catch (error) {
    statusText.textContent = "Erreur : " + error.message;
    moreButton.style.display = "none";
  } finally {
    busy = false;
  }
}

function displayAnime(list, append = false) {
  if (!append) catalogue.innerHTML = "";

  list.forEach(anime => {
    const card = document.createElement("div");
    card.className = "card";

    const image = document.createElement("img");
    image.loading = "lazy";
    image.src = anime.coverImage?.large || "";
    image.alt = anime.title?.english ||
                anime.title?.romaji || "Anime";

    const title = document.createElement("p");
    title.textContent = anime.title?.english ||
                        anime.title?.romaji || "Sans titre";

    const info = document.createElement("div");
    info.className = "small";
    info.textContent =
      (anime.seasonYear || "Année inconnue") +
      " · " +
      (anime.episodes != null
        ? anime.episodes + " épisodes"
        : "Recherche du nombre d'épisodes...");

    card.append(image, title, info);
    catalogue.appendChild(card);

    if (anime.episodes == null) {
      getJikanEpisodes(anime).then(count => {
        if (count != null) {
          info.textContent =
            (anime.seasonYear || "Année inconnue") +
            " · " + count + " épisodes";
        } else {
          info.textContent =
            (anime.seasonYear || "Année inconnue") +
            " · Nombre d'épisodes inconnu";
        }
      });
    }

    card.onclick = () => openAnime(anime);
  });
}

async function searchAnime() {
  const name = document.getElementById("search").value.trim();
  if (!name) return;

  busy = false;
  currentMode = "search";
  catalogue.innerHTML = "";
  details.style.display = "none";
  moreButton.style.display = "none";
  statusText.textContent = "Recherche en cours...";
  document.getElementById("heading").textContent = "Résultats de recherche";

  const query = `
    query ($search:String) {
      Page(page:1,perPage:20) {
        media(search:$search,type:ANIME,sort:SEARCH_MATCH) {
          ${animeFields}
        }
      }
    }
  `;

  try {
    const data = await anilist(query, {search:name});
    displayAnime(data.Page.media);

    statusText.textContent =
      data.Page.media.length + " résultat(s) trouvé(s).";

    if (!data.Page.media.length) {
      statusText.textContent = "Aucun résultat trouvé.";
    }
  } catch (error) {
    statusText.textContent = "Erreur de recherche : " + error.message;
  }
}

async function openAnime(anime) {
  details.style.display = "block";
  details.innerHTML = "<p>Chargement de la fiche...</p>";
  details.scrollIntoView({behavior:"smooth"});

  const count = await getJikanEpisodes(anime);

  details.innerHTML = "";

  const image = document.createElement("img");
  image.src = anime.coverImage?.extraLarge ||
              anime.coverImage?.large || "";

  const title = document.createElement("h2");
  title.textContent = anime.title?.english ||
                      anime.title?.romaji || "Anime";

  const info = document.createElement("p");
  info.textContent =
    "Année : " + (anime.seasonYear || "inconnue") +
    " · Épisodes : " +
    (count != null ? count : "inconnu") +
    " · Note : " +
    (anime.averageScore != null ? anime.averageScore + "/100" : "inconnue");

  const genres = document.createElement("p");
  genres.textContent = "Genres : " +
    (anime.genres || []).join(", ");

  const description = document.createElement("p");
  description.textContent = anime.description
    ? anime.description.replace(/<[^>]*>/g, "")
    : "Résumé indisponible.";

  const link = document.createElement("a");
  link.href = anime.siteUrl || "https://anilist.co/";
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "Voir la fiche AniList";

  const note = document.createElement("p");
  note.textContent =
    "Les vidéos ne sont pas fournies par AniList. Ajoute uniquement des liens vidéo autorisés.";

  details.append(image, title, info, genres, description, link, note);
}

function loadMore() {
  if (currentMode !== "popular" && currentMode !== "trending") return;
  page++;
  loadAnime(true);
}

showCatalog();
</script>
</body>
</html>
