<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>OTAKU_ZONE</title>

<style>
:root {
  --bg: #000;
  --gold: #D4AF37;
  --white: #fff;
  --panel: #101010;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}
header {
  background: #080808;
  border-bottom: 2px solid var(--gold);
  padding: 18px 12px;
  text-align: center;
}
.logo {
  color: var(--gold);
  font-size: 27px;
  font-weight: bold;
}
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
}
button, input, select { font-size: 15px; }
button { cursor: pointer; }
.nav-btn, .gold-btn {
  color: var(--gold);
  background: #080808;
  border: 1px solid var(--gold);
  border-radius: 7px;
  padding: 10px 14px;
}
.nav-btn:hover, .gold-btn:hover {
  background: var(--gold);
  color: #000;
}
main {
  max-width: 1100px;
  margin: auto;
  padding: 14px;
}
input, select {
  width: 100%;
  padding: 12px;
  background: #111;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
}
h2 { color: var(--gold); }
#search { margin-bottom: 16px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.card {
  background: var(--panel);
  border: 1px solid #292929;
  border-radius: 9px;
  overflow: hidden;
  cursor: pointer;
}
.card img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  background: #171717;
}
.card h3 {
  font-size: 15px;
  padding: 0 10px;
}
.card p {
  font-size: 12px;
  color: #bbb;
  padding: 0 10px;
}
.hidden { display: none !important; }
.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
}
.player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0;
}
.episodes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  gap: 8px;
}
.ep {
  padding: 12px 5px;
  background: #101010;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
}
.ep.active, .ep:hover {
  background: var(--gold);
  color: #000;
}
.notice {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
}
footer {
  text-align: center;
  color: #888;
  padding: 25px;
}
</style>
</head>

<body>
<header>
  <div class="logo">⚡ OTAKU_ZONE</div>
  <p>Ton univers anime</p>
</header>

<nav>
  <button class="nav-btn" onclick="showHome()">Accueil</button>
  <button class="nav-btn" onclick="loadCatalogue()">Actualiser</button>
</nav>

<main>
<section id="home">
  <input id="search" placeholder="🔎 Rechercher un anime..."
         oninput="filterAnime()">

  <h2>Catalogue anime</h2>
  <p id="status" class="notice">Chargement du catalogue...</p>
  <div id="catalogue" class="grid"></div>

  <div class="controls">
    <button class="gold-btn" onclick="previousPage()">Précédent</button>
    <button class="gold-btn" onclick="nextPage()">Suivant</button>
  </div>
</section>

<section id="details" class="hidden">
  <button class="nav-btn" onclick="showHome()">← Retour</button>
  <h2 id="animeTitle">Anime</h2>
  <p id="animeInfo" class="notice"></p>

  <div class="player">
    <iframe id="video"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      loading="lazy"></iframe>
  </div>

  <div class="controls">
    <label>Saison
      <select id="season" onchange="changeSeason()"></select>
    </label>
    <label>Épisode
      <select id="episode" onchange="playSelectedEpisode()"></select>
    </label>
  </div>

  <h2>Épisodes</h2>
  <div id="episodes" class="episodes"></div>
  <p id="episodeStatus" class="notice"></p>
</section>
</main>

<footer>OTAKU_ZONE ©</footer>

<script>
const API = "https://frembed.bar/api/public/v1";
const BASE = "https://frembed.bar";

let animeList = [];
let filteredAnime = [];
let page = 1;
let totalPages = 1;
let currentAnime = null;
let currentSeason = 1;
let currentEpisode = 1;
let episodeData = [];

async function api(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("Erreur API : " + response.status);
  return response.json();
}

async function loadCatalogue() {
  const status = document.getElementById("status");
  status.textContent = "Chargement du catalogue...";
  document.getElementById("catalogue").innerHTML = "";

  try {
    const data = await api(
      `${API}/anime?type=all&order=popular&limit=40&page=${page}`
    );

    animeList = data.result?.items || [];
    totalPages = data.result?.totalPages || 1;

    filteredAnime = animeList;
    renderCatalogue(filteredAnime);

    status.textContent = animeList.length
      ? `Page ${page} sur ${totalPages}`
      : "Aucun anime disponible.";
  } catch (error) {
    status.textContent =
      "Impossible de charger le catalogue. Vérifie ta connexion et réessaie.";
  }
}

function renderCatalogue(list) {
  const box = document.getElementById("catalogue");
  box.innerHTML = "";

  list.forEach(anime => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.alt = anime.title || "Anime";
    img.src = anime.poster || 
      "https://placehold.co/300x400/111/D4AF37?text=OTAKU_ZONE";

    const title = document.createElement("h3");
    title.textContent = anime.title || "Anime sans titre";

    const version = document.createElement("p");
    version.textContent = anime.version || "Version non précisée";

    card.append(img, title, version);
    card.onclick = () => openAnime(anime);
    box.appendChild(card);
  });
}

function filterAnime() {
  const query = document.getElementById("search").value.toLowerCase();

  filteredAnime = animeList.filter(anime =>
    (anime.title || "").toLowerCase().includes(query)
  );

  renderCatalogue(filteredAnime);
}

function nextPage() {
  if (page < totalPages) {
    page++;
    loadCatalogue();
    window.scrollTo(0, 0);
  }
}

function previousPage() {
  if (page > 1) {
    page--;
    loadCatalogue();
    window.scrollTo(0, 0);
  }
}

async function openAnime(anime) {
  currentAnime = anime;
  currentSeason = 1;
  currentEpisode = 1;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("details").classList.remove("hidden");
  document.getElementById("animeTitle").textContent =
    anime.title || "Anime";

  document.getElementById("animeInfo").textContent =
    "Chargement des épisodes...";

  document.getElementById("video").src = "about:blank";
  document.getElementById("episodes").innerHTML = "";

  try {
    const id = encodeURIComponent(anime.tmdb || anime.imdb);
    const data = await api(`${API}/anime/${id}`);

    const result = data.result || {};
    episodeData = result.items || [];

    if (result.type === "movie") {
      document.getElementById("animeInfo").textContent =
        "Film d'animation";
      document.getElementById("season").innerHTML =
        '<option value="0">Film</option>';
      document.getElementById("episode").innerHTML =
        '<option value="1">Film</option>';
      document.getElementById("episodes").innerHTML = "";
      document.getElementById("video").src =
        `${BASE}/embed/movie/${encodeURIComponent(anime.tmdb || anime.imdb)}`;
      return;
    }

    const seasons = [...new Set(
      episodeData.map(ep => Number(ep.sa)).filter(Number.isFinite)
    )].sort((a, b) => a - b);

    const seasonSelect = document.getElementById("season");
    seasonSelect.innerHTML = "";

    seasons.forEach(s => seasonSelect.add(new Option("Saison " + s, s)));

    if (!seasons.length) {
      document.getElementById("animeInfo").textContent =
        "Aucun épisode trouvé pour cet anime.";
      document.getElementById("episode").innerHTML = "";
      return;
    }

    currentSeason = seasons[0];
    seasonSelect.value = String(currentSeason);

    document.getElementById("animeInfo").textContent =
      `${episodeData.length} épisode(s) disponible(s) dans les données reçues.`;

    renderSeasonEpisodes();
  } catch (error) {
    document.getElementById("animeInfo").textContent =
      "Impossible de récupérer les épisodes de cet anime.";
  }
}

function renderSeasonEpisodes() {
  const list = episodeData
    .filter(ep => Number(ep.sa) === currentSeason)
    .sort((a, b) => Number(a.epi) - Number(b.epi));

  const select = document.getElementById("episode");
  select.innerHTML = "";

  list.forEach(ep => {
    select.add(new Option(
      `Épisode ${ep.epi}${ep.version ? " · " + ep.version : ""}`,
      ep.epi
    ));
  });

  const box = document.getElementById("episodes");
  box.innerHTML = "";

  list.forEach(ep => {
    const btn = document.createElement("button");
    btn.className = "ep";
    btn.textContent = ep.epi;
    btn.title = ep.version || "Version non précisée";
    btn.onclick = () => playEpisode(Number(ep.epi));
    box.appendChild(btn);
  });

  if (list.length) {
    const first = list[0];
    currentEpisode = Number(first.epi);
    select.value = String(currentEpisode);
    playEpisode(currentEpisode);
  } else {
    document.getElementById("video").src = "about:blank";
    document.getElementById("episodeStatus").textContent =
      "Aucun épisode disponible pour cette saison.";
  }
}

function changeSeason() {
  currentSeason = Number(document.getElementById("season").value);
  renderSeasonEpisodes();
}

function playSelectedEpisode() {
  playEpisode(Number(document.getElementById("episode").value));
}

function playEpisode(number) {
  currentEpisode = number;

  const ep = episodeData.find(item =>
    Number(item.sa) === currentSeason &&
    Number(item.epi) === currentEpisode
  );

  if (!ep) return;

  document.getElementById("video").src =
    ep.link ||
    `${BASE}/embed/serie/${encodeURIComponent(currentAnime.tmdb || currentAnime.imdb)}?sa=${currentSeason}&epi=${currentEpisode}`;

  document.getElementById("episodeStatus").textContent =
    "Version annoncée : " + (ep.version || "non précisée");

  document.querySelectorAll(".ep").forEach(btn => {
    btn.classList.toggle("active", Number(btn.textContent) === number);
  });

  document.getElementById("episode").value = String(number);
}

function showHome() {
  document.getElementById("video").src = "about:blank";
  document.getElementById("details").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

loadCatalogue();
</script>
</body>
    </html>
