<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title><style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#111;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0}
main{padding:15px;max-width:1100px;margin:auto}
input,button{padding:12px;border:1px solid #d4af37;border-radius:8px;background:#181818;color:white}
input{width:100%;margin:10px 0}
button{cursor:pointer}
button:active{background:#d4af37;color:#000}
#status{color:#d4af37}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card h3{padding:9px;margin:0;font-size:14px}
#details{margin-top:22px;padding:12px;background:#151515;border-radius:10px}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
video{width:100%;max-height:450px;background:#000;margin-top:12px}
.hidden{display:none}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body>
<header>
<h1>OTAKU_ZONE</h1>
<p>Ton univers anime</p>
</header><main>
<input id="search" placeholder="Rechercher un anime...">
<button id="searchBtn">Rechercher</button><p id="status">Chargement des animés...</p>
<div id="catalog" class="grid"></div><section id="details" class="hidden">
<h2 id="animeTitle"></h2>
<p id="animeInfo"></p>
<h3>Saisons</h3>
<div id="seasons"></div>
<h3>Épisodes</h3>
<div id="episodes" class="episodes"></div>
<p id="episodeInfo"></p>
<video id="player" controls playsinline></video>
</section>
</main><script>
const API="https://graphql.anilist.co";
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

const $=id=>document.getElementById(id);
let database={animes:[]};
let selectedAnime=null;
let selectedSeason=null;

async function getJSON(url){
  const r=await fetch(url);
  if(!r.ok)throw Error("HTTP "+r.status);
  return r.json();
}

async function anilist(query,variables={}){
  const r=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({query,variables})
  });
  if(!r.ok)throw Error("AniList HTTP "+r.status);
  const json=await r.json();
  if(json.errors)throw Error("Erreur AniList");
  return json.data;
}

function titleOf(a){
  return a?.title?.english||a?.title?.romaji||a?.title||"Anime";
}

function imageOf(a){
  return a?.coverImage?.large||a?.coverImage?.medium||a?.image||"";
}

async function loadDatabase(){
  try{
    database=await getJSON(DB);
    if(!Array.isArray(database.animes))database={animes:[]};
  }catch(e){
    database={animes:[]};
    console.error("JSON inaccessible",e);
  }
}

function showCatalog(list){
  $("catalog").innerHTML="";
  if(!list.length){
    $("status").textContent="Aucun anime trouvé.";
    return;
  }

  list.forEach(a=>{
    const card=document.createElement("article");
    card.className="card";

    const img=document.createElement("img");
    img.src=imageOf(a);
    img.alt=titleOf(a);
    img.loading="lazy";

    const name=document.createElement("h3");
    name.textContent=titleOf(a);

    card.append(img,name);
    card.onclick=()=>openAnime(a);
    $("catalog").appendChild(card);
  });
}

async function loadTrending(){
  $("status").textContent="Chargement...";
  try{
    const data=await anilist(`
      query {
        Page(page:1,perPage:24) {
          media(type:ANIME,sort:TRENDING_DESC) {
            id
            title { romaji english }
            coverImage { large medium }
            episodes
          }
        }
      }
    `);
    showCatalog(data.Page.media);
    $("status").textContent="Animés populaires";
  }catch(e){
    $("status").textContent="Catalogue indisponible. Vérifie ta connexion et réessaie.";
  }
}

async function searchAnime(){
  const q=$("search").value.trim();
  if(!q)return loadTrending();

  $("status").textContent="Recherche...";
  try{
    const data=await anilist(`
      query($search:String) {
        Page(page:1,perPage:24) {
          media(search:$search,type:ANIME,sort:SEARCH_MATCH) {
            id
            title { romaji english }
            coverImage { large medium }
            episodes
          }
        }
      }
    `,{search:q});

    showCatalog(data.Page.media);
    $("status").textContent="Résultats de recherche";
  }catch(e){
    $("status").textContent="Recherche indisponible. Réessaie.";
  }
}

function findLocal(anime){
  return database.animes.find(a=>
    Number(a.anilistId)===Number(anime.id) ||
    String(a.title||"").toLowerCase()===titleOf(anime).toLowerCase()
  );
}

function openAnime(anime){
  selectedAnime=anime;
  selectedSeason=null;

  $("details").classList.remove("hidden");
  $("details").scrollIntoView({behavior:"smooth"});
  $("animeTitle").textContent=titleOf(anime);
  $("episodes").innerHTML="";
  $("seasons").innerHTML="";
  $("episodeInfo").textContent="";
  $("player").removeAttribute("src");
  $("player").load();

  const local=findLocal(anime);

  if(!local||!Array.isArray(local.seasons)||!local.seasons.length){
    $("animeInfo").textContent=
      "Aucune saison enregistrée pour cet anime dans episodes.json.";
    return;
  }

  $("animeInfo").textContent="Choisis une saison.";

  local.seasons.forEach((season,index)=>{
    const b=document.createElement("button");
    b.textContent=season.title||("Saison "+season.number);
    b.style.margin="4px";
    b.onclick=()=>showEpisodes(season);
    $("seasons").appendChild(b);

    if(index===0)selectedSeason=season;
  });

  if(selectedSeason)showEpisodes(selectedSeason);
}

function showEpisodes(season){
  selectedSeason=season;
  $("episodes").innerHTML="";
  $("episodeInfo").textContent="";

  const list=season.episodes||[];

  if(!list.length){
    $("episodeInfo").textContent="Aucun épisode enregistré.";
    return;
  }

  list.forEach(ep=>{
    const b=document.createElement("button");
    b.textContent=ep.number;
    b.title=ep.title||("Épisode "+ep.number);
    b.onclick=()=>playEpisode(ep);
    $("episodes").appendChild(b);
  });
}

function playEpisode(ep){
  const player=$("player");
  const url=(ep.url||"").trim();

  if(!url){
    $("episodeInfo").textContent=
      "Épisode "+ep.number+" : aucun lien vidéo enregistré.";
    return;
  }

  if(!/^https?:\/\//i.test(url)){
    $("episodeInfo").textContent="Lien vidéo invalide.";
    return;
  }

  if(/\/dl\//i.test(new URL(url).pathname)){
    $("episodeInfo").textContent=
      "Ce lien est une page de téléchargement, pas une adresse de lecture directe.";
    return;
  }

  player.src=url;
  player.load();
  $("episodeInfo").textContent="Chargement de l'épisode "+ep.number+"...";
  player.play().catch(()=>{
    $("episodeInfo").textContent=
      "Lecture automatique impossible. Appuie sur Lecture ou vérifie le lien vidéo.";
  });
}

$("searchBtn").addEventListener("click",searchAnime);
$("search").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchAnime();
});

(async()=>{
  await loadDatabase();
  await loadTrending();
})();
</script></body>
 </html>
