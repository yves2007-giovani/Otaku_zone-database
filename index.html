<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:18px;background:#111;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0}
main{padding:15px}
input,button{padding:12px;border-radius:8px;border:1px solid #d4af37;background:#181818;color:white}
input{width:100%;margin:12px 0}
button{cursor:pointer}
#status{color:#d4af37}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card h3{padding:8px;margin:0;font-size:14px}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#details{background:#151515;padding:12px;border-radius:10px;margin-top:20px}
video{width:100%;background:#000}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>OTAKU_ZONE</h1>
<p>Ton univers anime</p>
</header>
<main>
<input id="search" placeholder="Rechercher un anime">
<button onclick="searchAnime()">Rechercher</button>
<p id="status">Chargement...</p>
<div id="catalog" class="grid"></div><section id="details" hidden>
<h2 id="animeTitle"></h2>
<div id="episodes" class="episodes"></div>
<p id="episodeInfo"></p>
<video id="player" controls playsinline></video>
</section>
</main><script>
const API="https://mirurotvapi.vercel.app/api";
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

const $=id=>document.getElementById(id);

function titleOf(a){
 return a?.title?.english||a?.title?.romaji||a?.title||"Anime";
}
function imageOf(a){
 return a?.coverImage?.large||a?.coverImage?.medium||a?.image||"";
}
async function getJSON(url){
 const r=await fetch(url);
 if(!r.ok)throw Error("HTTP "+r.status);
 return r.json();
}
function showCatalog(list){
 $("catalog").innerHTML="";
 if(!Array.isArray(list)||!list.length){
  $("status").textContent="Aucun résultat.";
  return;
 }
 list.forEach(a=>{
  const card=document.createElement("div");
  card.className="card";
  const img=document.createElement("img");
  img.src=imageOf(a);
  img.alt=titleOf(a);
  const name=document.createElement("h3");
  name.textContent=titleOf(a);
  card.append(img,name);
  card.onclick=()=>openAnime(a);
  $("catalog").append(card);
 });
}
async function loadTrending(){
 try{
  const d=await getJSON(API+"/trending?per_page=24");
  showCatalog(d.results?.results||[]);
  $("status").textContent="Animés populaires";
 }catch(e){
  $("status").textContent="API indisponible. Vérifie le lien ou réessaie plus tard.";
 }
}
async function searchAnime(){
 const q=$("search").value.trim();
 if(!q)return loadTrending();
 try{
  $("status").textContent="Recherche...";
  const d=await getJSON(API+"/search?query="+encodeURIComponent(q)+"&per_page=24");
  showCatalog(d.results?.results||[]);
  $("status").textContent="Résultats";
 }catch(e){
  $("status").textContent="Recherche indisponible.";
 }
}
async function openAnime(a){
 $("details").hidden=false;
 $("animeTitle").textContent=titleOf(a);
 $("episodes").innerHTML="";
 $("episodeInfo").textContent="Chargement des épisodes...";
 $("player").removeAttribute("src");
 $("player").load();

 try{
  const d=await getJSON(API+"/episodes/"+encodeURIComponent(a.id));
  const providers=d.results?.providers||{};
  let list=[];

  Object.entries(providers).forEach(([provider,data])=>{
   Object.entries(data.episodes||{}).forEach(([lang,eps])=>{
    if(Array.isArray(eps))eps.forEach(ep=>list.push({...ep,provider,lang}));
   });
  });

  if(!list.length){
   $("episodeInfo").textContent="Aucun épisode disponible.";
   return;
  }

  list.sort((x,y)=>x.number-y.number);
  list.forEach(ep=>{
   const b=document.createElement("button");
   b.textContent="Ép. "+ep.number;
   b.onclick=()=>loadEpisode(a.id,ep);
   $("episodes").append(b);
  });
  $("episodeInfo").textContent=list.length+" épisodes trouvés.";
 }catch(e){
  $("episodeInfo").textContent="Impossible de charger les épisodes.";
 }
}
async function loadEpisode(animeId,ep){
 try{
  $("episodeInfo").textContent="Recherche de la source vidéo...";
  const d=await getJSON(API+"/"+ep.id);
  const streams=d.results?.streams||[];
  const stream=streams.find(s=>s.url);
  if(!stream){
   $("episodeInfo").textContent="Aucune source vidéo disponible.";
   return;
  }
  const url=stream.url;
  const player=$("player");
  player.src=url;
  player.load();
  player.play().catch(()=>{});
  $("episodeInfo").textContent="Épisode "+ep.number;
 }catch(e){
  $("episodeInfo").textContent="Lecture indisponible. La source peut être bloquée.";
 }
}
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchAnime();
});
loadTrending();
</script></body>
</html>
