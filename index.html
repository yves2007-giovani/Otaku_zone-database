<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otaku_zone</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#171717;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0}
header p{color:#ccc}
.search{display:flex;gap:8px;padding:14px}
input{width:100%;min-width:0;padding:12px;background:#222;color:white;border:1px solid #d4af37;border-radius:8px}
button{padding:11px;background:#d4af37;color:#111;border:0;border-radius:8px;font-weight:bold}
#message{text-align:center;padding:10px;color:#d4af37}
#catalogue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:#191919;border:1px solid #333;border-radius:10px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:cover}
.card h3{padding:0 10px;font-size:15px}
.card button{margin:0 10px 12px}
#details{padding:16px}
.hidden{display:none}
.related{margin:8px 0;padding:10px;background:#202020;border-radius:8px}
a{color:#d4af37}
@media(min-width:700px){#catalogue{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>

<body>
<header>
<h1>Otaku_zone</h1>
<p>Ton univers anime en français 🇫🇷</p>
</header>

<div class="search">
<input id="recherche" placeholder="Rechercher un anime...">
<button onclick="rechercher()">Chercher</button>
</div>

<div id="message">Prêt à rechercher des animes.</div>
<main id="catalogue"></main>

<section id="details" class="hidden">
<button onclick="retour()">← Retour</button>
<div id="contenu"></div>
</section>

<script>
const catalogue=document.getElementById("catalogue");
const message=document.getElementById("message");
const details=document.getElementById("details");

const titres=anime=>
 anime.title.english||anime.title.romaji||anime.title.native||"Anime";

async function traduire(texte){
 if(!texte)return "Aucune description disponible.";

 try{
  const url="https://api.mymemory.translated.net/get?q="+
   encodeURIComponent(texte.slice(0,450))+"&langpair=en|fr";

  const reponse=await fetch(url);
  const donnees=await reponse.json();

  if(donnees.responseStatus===200&&donnees.responseData.translatedText){
   return donnees.responseData.translatedText;
  }
 }catch(e){}

 return texte;
}

async function rechercher(){
 const recherche=document.getElementById("recherche").value.trim();

 if(!recherche){
  message.textContent="Écris le nom d'un anime.";
  return;
 }

 catalogue.innerHTML="";
 details.classList.add("hidden");
 catalogue.style.display="grid";
 message.textContent="Recherche en cours...";

 const query=`
 query($search:String){
  Page(page:1,perPage:20){
   media(search:$search,type:ANIME,sort:SEARCH_MATCH){
    id
    title{romaji english native}
    coverImage{large}
    description(asHtml:false)
    episodes
    status
    format
    genres
    relations{
     edges{
      relationType
      node{
       type
       title{romaji english native}
       format
      }
     }
    }
   }
  }
 }`;

 try{
  const response=await fetch("https://graphql.anilist.co",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
   },
   body:JSON.stringify({
    query:query,
    variables:{search:recherche}
   })
  });

  if(!response.ok)throw new Error();

  const data=await response.json();
  const animes=data.data.Page.media;

  if(!animes.length){
   message.textContent="Aucun anime trouvé.";
   return;
  }

  message.textContent=animes.length+" animes trouvés.";

  animes.forEach(anime=>{
   const card=document.createElement("article");
   card.className="card";

   const img=document.createElement("img");
   img.src=anime.coverImage.large;
   img.alt=titres(anime);
   img.loading="lazy";

   const h=document.createElement("h3");
   h.textContent=titres(anime);

   const button=document.createElement("button");
   button.textContent="Voir les détails";
   button.onclick=()=>afficherDetails(anime);

   card.append(img,h,button);
   catalogue.appendChild(card);
  });

 }catch(e){
  message.textContent="Erreur de connexion. Vérifie Internet et réessaie.";
 }
}

function echapper(texte){
 return String(texte||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function afficherDetails(anime){
 catalogue.style.display="none";
 details.classList.remove("hidden");

 const contenu=document.getElementById("contenu");
 const titre=titres(anime);

 contenu.innerHTML="<h2>"+echapper(titre)+"</h2><p>Chargement de la description...</p>";

 const description=anime.description||"";
 let descriptionFR=description;

 if(description){
  descriptionFR=await traduire(description);
 }

 const genres=(anime.genres||[]).map(echapper).join(", ");
 const relations=(anime.relations?.edges||[]).filter(
  edge=>edge.node.type==="ANIME"
 );

 let associes="";

 if(relations.length){
  associes=relations.map(edge=>{
   const nom=titres(edge.node);
   return '<div class="related">'+
    '<strong>'+echapper(nom)+'</strong><br>'+
    '<small>'+echapper(edge.node.format||"Anime")+
    " • "+echapper(edge.relationType)+"</small></div>";
  }).join("");
 }else{
  associes="<p>Aucun contenu associé trouvé.</p>";
 }

 contenu.innerHTML=`
  <h2>${echapper(titre)}</h2>
  <img src="${echapper(anime.coverImage.large)}"
   alt="Affiche" style="width:180px;max-width:100%;border-radius:10px">

  <p><strong>Format :</strong> ${echapper(anime.format||"Inconnu")}</p>
  <p><strong>Épisodes :</strong> ${echapper(anime.episodes||"Non précisé")}</p>
  <p><strong>Statut :</strong> ${echapper(anime.status||"Inconnu")}</p>
  <p><strong>Genres :</strong> ${genres||"Non précisés"}</p>

  <h3>Synopsis en français 🇫🇷</h3>
  <p>${echapper(descriptionFR||"Aucune description disponible.")}</p>

  <h3>Saisons, films et OAV associés</h3>
  ${associes}

  <h3>Où regarder ?</h3>
  <p>Consulte les plateformes officielles pour trouver cet anime.</p>
  <p><a href="https://www.crunchyroll.com/"
   target="_blank" rel="noopener noreferrer">Découvrir Crunchyroll</a></p>
 `;
}

function retour(){
 details.classList.add("hidden");
 catalogue.style.display="grid";
 window.scrollTo(0,0);
}

document.getElementById("recherche").addEventListener("keydown",e=>{
 if(e.key==="Enter")rechercher();
});

document.getElementById("recherche").value="Attack on Titan";
rechercher();
</script>
</body>
  </html>
