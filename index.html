<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>OTAKU_ZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0 0 15px}
input,button{padding:12px;border-radius:7px;border:1px solid #d4af37}
input{width:100%;background:#171717;color:white}
button{background:#d4af37;color:#000;font-weight:bold;cursor:pointer;margin:4px}
main{padding:15px;max-width:1000px;margin:auto}
#catalogue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#171717;padding:10px;border-radius:9px;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover;border-radius:6px}
.card h3{font-size:14px}
#details{margin-top:20px}
#episodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#episodes button{margin:0;padding:10px 3px}
video{width:100%;max-height:450px;background:#000;margin-top:12px}
a{color:#d4af37}
.hidden{display:none}
@media(min-width:650px){
#catalogue{grid-template-columns:repeat(5,minmax(0,1fr))}
#episodes{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
<h1>OTAKU_ZONE</h1>
<input id="search" placeholder="Rechercher un animé..." autocomplete="off">
<button onclick="searchAnime()">RECHERCHER</button>
</header>

<main>
<div id="message"></div>
<div id="catalogue"></div>

<section id="details" class="hidden">
<h2 id="animeTitle"></h2>
<div id="seasons"></div>
<h3>Épisodes</h3>
<div id="episodes"></div>

<video id="player" controls playsinline></video>
<p id="videoMessage"></p>
<a id="download" class="hidden" href="#" download>Télécharger l'épisode</a>
</section>
</main>

<script>
const API="https://graphql.anilist.co";
const JSON_URL="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

let database={animes:[]};
let currentAnime=null;
let currentSeason=null;

async function loadDatabase(){
  try{
    const response=await fetch(JSON_URL+"?t="+Date.now());
    if(!response.ok) throw new Error();
    database=await response.json();
  }catch(e){
    database={animes:[]};
    document.getElementById("message").textContent=
      "Impossible de charger episodes.json.";
  }
}

async function searchAnime(){
  const query=document.getElementById("search").value.trim();
  if(!query)return;

  const catalogue=document.getElementById("catalogue");
  catalogue.innerHTML="Recherche en cours...";
  document.getElementById("details").classList.add("hidden");

  try{
    const response=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        query:`query ($search:String) {
          Page(page:1,perPage:20) {
            media(search:$search,type:ANIME,sort:POPULARITY_DESC) {
              id
              title { romaji english }
              coverImage { large }
              episodes
              description(asHtml:false)
            }
          }
        }`,
        variables:{search:query}
      })
    });

    const data=await response.json();
    const animes=data.data.Page.media;
    catalogue.innerHTML="";

    if(!animes.length){
      catalogue.textContent="Aucun animé trouvé.";
      return;
    }

    animes.forEach(anime=>{
      const card=document.createElement("div");
      card.className="card";

      const img=document.createElement("img");
      img.src=anime.coverImage.large;
      img.alt="Affiche de "+(anime.title.english||anime.title.romaji);

      const title=document.createElement("h3");
      title.textContent=anime.title.english||anime.title.romaji;

      card.append(img,title);
      card.onclick=()=>openAnime(anime);
      catalogue.appendChild(card);
    });
  }catch(e){
    catalogue.textContent="Erreur de connexion. Réessaie.";
  }
}

function openAnime(anime){
  currentAnime=anime;
  currentSeason=null;

  document.getElementById("details").classList.remove("hidden");
  document.getElementById("animeTitle").textContent=
    anime.title.english||anime.title.romaji;

  const saved=database.animes.find(a=>
    Number(a.anilistId)===Number(anime.id)
  );

  const seasons=document.getElementById("seasons");
  seasons.innerHTML="";

  if(!saved||!saved.seasons||!saved.seasons.length){
    seasons.textContent=
      "Aucun épisode enregistré pour cet animé dans episodes.json.";
    document.getElementById("episodes").innerHTML="";
    stopPlayer();
    return;
  }

  saved.seasons.forEach(season=>{
    const btn=document.createElement("button");
    btn.textContent=season.title||"Saison "+season.number;
    btn.onclick=()=>showSeason(saved,season);
    seasons.appendChild(btn);
  });

  showSeason(saved,saved.seasons[0]);
}

function showSeason(anime,season){
  currentAnime=anime;
  currentSeason=season;

  const grid=document.getElementById("episodes");
  grid.innerHTML="";

  (season.episodes||[]).forEach(ep=>{
    const btn=document.createElement("button");
    btn.textContent="Ép. "+ep.number;
    btn.onclick=()=>playEpisode(ep);
    grid.appendChild(btn);
  });

  stopPlayer();
}

function stopPlayer(){
  const player=document.getElementById("player");
  player.pause();
  player.removeAttribute("src");
  player.load();

  document.getElementById("download").classList.add("hidden");
  document.getElementById("videoMessage").textContent="";
}

function playEpisode(ep){
  stopPlayer();

  if(!ep.url){
    document.getElementById("videoMessage").textContent=
      "Lien vidéo manquant pour cet épisode.";
    return;
  }

  const player=document.getElementById("player");
  player.src=ep.url;
  player.load();
  player.play().catch(()=>{
    document.getElementById("videoMessage").textContent=
      "Lecture impossible. La source peut être incompatible ou le lien expiré.";
  });

  const download=document.getElementById("download");

  // Le téléchargement dépend des autorisations du serveur vidéo.
  // Ce bouton ne contourne pas les restrictions de la source.
  if(ep.downloadUrl){
    download.href=ep.downloadUrl;
    download.classList.remove("hidden");
  }else{
    document.getElementById("videoMessage").textContent=
      "La lecture est tentée. Aucun lien de téléchargement autorisé n'est configuré.";
  }
}

document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchAnime();
});

loadDatabase();
</script>
</body>
</html>
