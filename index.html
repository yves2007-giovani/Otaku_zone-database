<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:24px 15px;text-align:center;background:#111;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0;font-size:30px;letter-spacing:2px}
header p{color:#aaa;margin:8px 0 0}
main{max-width:1100px;margin:auto;padding:16px}
.search{display:flex;gap:8px;margin-bottom:12px}
input,button{border:1px solid #d4af37;border-radius:8px;padding:12px;background:#181818;color:#fff}
input{width:100%;min-width:0}
button{cursor:pointer}
button:active,.active{background:#d4af37;color:#000}
#status{color:#d4af37;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #292929}
.poster{height:190px;background:#222;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#d4af37;font-weight:bold;font-size:18px}
.card img{display:block;width:100%;height:190px;object-fit:cover}
.card h3{font-size:14px;padding:10px;margin:0}
#details{margin-top:22px;padding:14px;background:#121212;border:1px solid #333;border-radius:12px}
.hidden{display:none}
#seasons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.episodes button{padding:12px 4px}
#episodeInfo{color:#d4af37;font-size:14px}
#animeInfo{color:#bbb;line-height:1.5}
@media(min-width:650px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.poster,.card img{height:240px}
.episodes{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
<h1>OTAKU_ZONE</h1>
<p>Ton univers anime</p>
</header>

<main>
<div class="search">
<input id="search" placeholder="Rechercher un anime...">
<button id="searchBtn">OK</button>
</div>

<p id="status">Chargement du catalogue...</p>
<div id="catalog" class="grid"></div>

<section id="details" class="hidden">
<h2 id="animeTitle"></h2>
<p id="animeInfo"></p>

<h3>Saisons</h3>
<div id="seasons"></div>

<h3>Épisodes</h3>
<div id="episodes" class="episodes"></div>

<p id="episodeInfo"></p>
</section>
</main>

<script>
const API="https://graphql.anilist.co";
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";

const $=id=>document.getElementById(id);
let animes=[];
let database=[];
let currentAnime=null;

async function api(query,variables={}){
 const response=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json","Accept":"application/json"},
  body:JSON.stringify({query,variables})
 });
 if(!response.ok)throw Error("AniList HTTP "+response.status);
 const data=await response.json();
 if(data.errors)throw Error(data.errors[0].message);
 return data.data;
}

async function loadDatabase(){
 try{
  const r=await fetch(DB+"?t="+Date.now());
  if(r.ok){
   const d=await r.json();
   database=Array.isArray(d.animes)?d.animes:[];
  }
 }catch(e){
  console.log("Base locale indisponible",e);
 }
}

async function loadCatalog(search=""){
 $("status").textContent="Chargement des animes...";
 $("catalog").innerHTML="";

 try{
  const query=`
   query($search:String){
    Page(page:1,perPage:30){
     media(type:ANIME,isAdult:false,search:$search,
      sort:POPULARITY_DESC){
      id
      episodes
      format
      seasonYear
      averageScore
      title{romaji english native}
      coverImage{large}
      description(asHtml:false)
     }
    }
   }`;

  const data=await api(query,{search:search||null});
  animes=data.Page.media;
  renderCatalog(animes);
 }catch(e){
  console.error(e);
  $("status").textContent=
   "Impossible de charger AniList. Vérifie ta connexion et réessaie.";
 }
}

function titleOf(a){
 return a.title.english||a.title.romaji||a.title.native||"Anime";
}

function renderCatalog(list){
 const catalog=$("catalog");
 catalog.innerHTML="";

 $("status").textContent=list.length+" anime(s) trouvés";

 if(!list.length){
  $("status").textContent="Aucun anime trouvé.";
  return;
 }

 list.forEach(anime=>{
  const card=document.createElement("article");
  card.className="card";

  const img=document.createElement("img");
  img.src=anime.coverImage.large;
  img.alt=titleOf(anime);
  img.loading="lazy";
  img.onerror=()=>{
   const p=document.createElement("div");
   p.className="poster";
   p.textContent=titleOf(anime);
   img.replaceWith(p);
  };

  card.appendChild(img);

  const name=document.createElement("h3");
  name.textContent=titleOf(anime);
  card.appendChild(name);

  card.onclick=()=>openAnime(anime);
  catalog.appendChild(card);
 });
}

function findLocalAnime(anime){
 return database.find(a=>
  Number(a.anilistId)===Number(anime.id)
 )||database.find(a=>
  String(a.title||"").toLowerCase()===titleOf(anime).toLowerCase()
 );
}

function openAnime(anime){
 currentAnime=anime;

 $("details").classList.remove("hidden");
 $("details").scrollIntoView({behavior:"smooth"});

 $("animeTitle").textContent=titleOf(anime);
 $("animeInfo").textContent=
  "Année : "+(anime.seasonYear||"inconnue")+
  " | Note : "+(anime.averageScore||"inconnue")+
  " | Épisodes : "+(anime.episodes||"inconnu");

 $("seasons").innerHTML="";
 $("episodes").innerHTML="";
 $("episodeInfo").textContent="";

 const local=findLocalAnime(anime);

 if(local&&Array.isArray(local.seasons)&&local.seasons.length){
  local.seasons.forEach((season,index)=>{
   const b=document.createElement("button");
   b.textContent=season.title||"Saison "+season.number;
   b.onclick=()=>showEpisodes(season);
   $("seasons").appendChild(b);

   if(index===0)showEpisodes(season);
  });
 }else{
  const total=Number(anime.episodes)||0;
  const season={number:1,title:"Saison 1",episodes:[]};

  for(let i=1;i<=total;i++){
   season.episodes.push({number:i,title:"Épisode "+i,url:""});
  }

  const b=document.createElement("button");
  b.textContent="Saison 1";
  b.classList.add("active");
  b.onclick=()=>showEpisodes(season);
  $("seasons").appendChild(b);

  showEpisodes(season);
 }
}

function showEpisodes(season){
 document.querySelectorAll("#seasons button")
 .forEach(b=>{
  b.classList.toggle(
   "active",
   b.textContent===(season.title||"Saison "+season.number)
  );
 });

 const episodes=$("episodes");
 episodes.innerHTML="";
 $("episodeInfo").textContent="";

 (season.episodes||[]).forEach(ep=>{
  const b=document.createElement("button");
  b.textContent=ep.number;
  b.title=ep.title||"Épisode "+ep.number;

  b.onclick=()=>{
   const url=(ep.url||ep.vf||ep.vostfr||"").trim();

   if(!url){
    $("episodeInfo").textContent=
     "Épisode "+ep.number+" : aucun lien vidéo enregistré.";
    return;
   }

   $("episodeInfo").textContent=
    "Lien disponible pour l'épisode "+ep.number+
    ". Le lecteur vidéo n'est pas intégré à cette version.";
  };

  episodes.appendChild(b);
 });
}

let searchTimer;

$("search").addEventListener("input",()=>{
 clearTimeout(searchTimer);
 searchTimer=setTimeout(()=>{
  loadCatalog($("search").value.trim());
 },500);
});

$("searchBtn").addEventListener("click",()=>{
 loadCatalog($("search").value.trim());
});

loadDatabase().then(()=>loadCatalog());
</script>
</body>
                          </html>
