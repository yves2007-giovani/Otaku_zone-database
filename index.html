<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>OTAKU_ZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{background:#111;padding:18px;border-bottom:2px solid #d6a400}
.logo{font-size:27px;font-weight:bold;color:#e8b800}
nav{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
button{padding:10px 14px;border:0;border-radius:5px;background:#d6a400;color:#111;font-weight:bold;cursor:pointer}
input{width:100%;padding:13px;margin-top:15px;background:#1b1b1b;color:white;border:1px solid #444;border-radius:6px}
main{padding:15px}
h2{color:#e8b800}
#catalogue{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:13px}
.card{background:#151515;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover;background:#222}
.card p{font-weight:bold;font-size:14px;padding:8px;margin:0}
.small{font-size:12px;color:#aaa;padding:0 8px 10px}
#details{display:none;background:#151515;padding:15px;border-radius:8px;margin-bottom:20px}
#details img{width:130px;max-height:190px;object-fit:cover;float:left;margin:0 15px 10px 0}
#details:after{content:"";display:block;clear:both}
.episode{display:inline-block;background:#292929;padding:10px;margin:4px;border-radius:5px}
article{padding:12px;margin:10px 0;background:#151515;border-radius:6px}
a{color:#e8b800}
#status{color:#aaa;font-size:13px}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>

<body>
<header>
  <div class="logo">OTAKU_ZONE</div>
  <nav>
    <button onclick="showSection('catalogueSection')">ANIMÉS</button>
    <button onclick="showSection('newsSection');loadNews()">ACTUALITÉS</button>
  </nav>
  <input id="search" placeholder="Rechercher un animé..." oninput="searchAnime()">
  <button onclick="searchJikan()" style="margin-top:10px;width:100%">
    RECHERCHER AVEC JIKAN
  </button>
</header>

<main>
  <p id="status">Chargement du catalogue...</p>

  <section id="details"></section>

  <section id="catalogueSection">
    <h2>Catalogue anime</h2>
    <div id="catalogue"></div>
    <button id="more" onclick="loadMore()" style="display:none;margin-top:20px">
      Voir plus
    </button>
  </section>

  <section id="newsSection" style="display:none">
    <h2>Actualités anime</h2>
    <div id="news">L'API d'actualités doit être hébergée pour fonctionner.</div>
  </section>
</main>

<footer>OTAKU_ZONE · Ton univers anime</footer>

<script>
const INDEX_URL =
"https://cdn.jsdelivr.net/gh/subhajeetch-fl/anime-mapper@main/data/anime-index.json";

const NEWS_API_URL = "";

let allAnime = [];
let shownAnime = [];
let displayed = 0;
const PAGE_SIZE = 40;

function showSection(id){
  document.getElementById("catalogueSection").style.display =
    id==="catalogueSection"?"block":"none";
  document.getElementById("newsSection").style.display =
    id==="newsSection"?"block":"none";
  document.getElementById("details").style.display="none";
  document.getElementById("search").style.display =
    id==="catalogueSection"?"block":"none";
}

function getTitle(a){
  return a.title || a.romajiTitle || a.englishTitle ||
         a.nativeTitle || "Anime sans titre";
}

function getId(a){
  return a.id || a.malId || a.mal_id;
}

function getImage(a){
  return a.image || a.imageUrl || a.poster || a.coverImage ||
    a.images?.jpg?.large_image_url ||
    a.images?.jpg?.image_url || "";
}

async function loadCatalog(){
  try{
    const response=await fetch(INDEX_URL);
    if(!response.ok)throw new Error("Catalogue indisponible");

    const data=await response.json();

    allAnime=Array.isArray(data)?data:
      data.data||data.anime||data.items||[];

    if(!allAnime.length)throw new Error("Format inconnu");

    allAnime.sort((a,b)=>getTitle(a).localeCompare(getTitle(b)));
    shownAnime=allAnime;
    renderAnime(true);

    document.getElementById("status").textContent=
      allAnime.length+" animés disponibles";
  }catch(error){
    document.getElementById("status").textContent=
      "Catalogue indisponible. Tu peux essayer la recherche Jikan.";
    console.error(error);
  }
}

function renderAnime(reset=false){
  const container=document.getElementById("catalogue");

  if(reset){
    container.innerHTML="";
    displayed=0;
  }

  const batch=shownAnime.slice(displayed,displayed+PAGE_SIZE);

  batch.forEach(anime=>{
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.loading="lazy";
    img.src=getImage(anime);
    img.alt=getTitle(anime);
    img.onerror=()=>img.style.display="none";

    const title=document.createElement("p");
    title.textContent=getTitle(anime);

    const info=document.createElement("div");
    info.className="small";
    info.textContent=anime.year||anime.type||"";

    card.append(img,title,info);
    card.onclick=()=>openAnime(anime);
    container.appendChild(card);
  });

  displayed+=batch.length;

  document.getElementById("more").style.display=
    displayed<shownAnime.length?"block":"none";
}

function loadMore(){renderAnime()}

function searchAnime(){
  const query=document.getElementById("search").value.trim().toLowerCase();

  shownAnime=allAnime.filter(a=>
    [a.title,a.romajiTitle,a.nativeTitle,a.englishTitle]
    .some(t=>String(t||"").toLowerCase().includes(query))
  );

  renderAnime(true);
}

async function searchJikan(){
  const query=document.getElementById("search").value.trim();
  if(!query){
    alert("Écris le nom d'un animé.");
    return;
  }

  const status=document.getElementById("status");
  const container=document.getElementById("catalogue");

  status.textContent="Recherche Jikan en cours...";
  container.innerHTML="";

  try{
    const response=await fetch(
      "https://api.jikan.moe/v4/anime?q="+
      encodeURIComponent(query)+"&limit=20"
    );

    if(response.status===429){
      throw new Error("Trop de requêtes. Attends quelques secondes.");
    }
    if(!response.ok)throw new Error("Erreur de l'API Jikan.");

    const result=await response.json();

    shownAnime=(result.data||[]).map(a=>({
      id:a.mal_id,
      title:a.title,
      englishTitle:a.title_english,
      nativeTitle:a.title_japanese,
      image:a.images?.jpg?.large_image_url,
      synopsis:a.synopsis,
      episodes:a.episodes,
      year:a.year,
      type:a.type,
      genres:a.genres
    }));

    displayed=0;
    renderAnime(true);
    status.textContent=shownAnime.length+
      " résultats trouvés avec Jikan.";

    document.getElementById("details").style.display="none";
  }catch(error){
    status.textContent=error.message;
  }
}

function getBucket(id){
  const n=Number(id);
  if(n>=1000000)return "other";
  return String(Math.floor(n/1000)).padStart(3,"0");
}

async function openAnime(anime){
  const details=document.getElementById("details");
  details.style.display="block";
  details.innerHTML="<p>Chargement de la fiche...</p>";
  details.scrollIntoView({behavior:"smooth"});

  let record=anime;
  const id=getId(anime);

  // Récupère la fiche complète depuis Anime Mapper si possible.
  try{
    if(id){
      const url=
      "https://cdn.jsdelivr.net/gh/subhajeetch-fl/anime-mapper@main/data/anime/"+
      getBucket(id)+"/"+id+".json";

      const response=await fetch(url);
      if(response.ok)record=await response.json();
    }
  }catch(error){
    console.log("Fiche Anime Mapper indisponible.");
  }

  details.innerHTML="";

  const img=document.createElement("img");
  img.src=getImage(record)||getImage(anime);
  img.onerror=()=>img.style.display="none";

  const title=document.createElement("h2");
  title.textContent=getTitle(record)||getTitle(anime);

  const metadata=document.createElement("p");
  metadata.textContent=[
    record.year||anime.year||"",
    record.type||anime.type||"",
    record.episodes!=null?record.episodes+" épisodes":""
  ].filter(Boolean).join(" · ");

  const synopsis=document.createElement("p");
  synopsis.textContent=record.synopsis||record.description||
    anime.synopsis||"Résumé indisponible.";

  details.append(img,title,metadata,synopsis);

  const genres=record.genres||anime.genres||[];
  if(genres.length){
    const genre=document.createElement("p");
    genre.textContent="Genres : "+genres.map(g=>
      typeof g==="string"?g:g.name
    ).join(", ");
    details.appendChild(genre);
  }

  const heading=document.createElement("h3");
  heading.textContent="Épisodes";
  details.appendChild(heading);

  const note=document.createElement("p");
  note.textContent=
    "Les vidéos ne sont pas fournies par Jikan ni Anime Mapper. Les liens autorisés doivent être ajoutés séparément.";
  details.appendChild(note);
}

async function loadNews(){
  const container=document.getElementById("news");

  if(!NEWS_API_URL){
    container.textContent=
      "L'API d'actualités doit être hébergée et son adresse ajoutée au code.";
    return;
  }

  container.textContent="Chargement des actualités...";

  try{
    const response=await fetch(NEWS_API_URL);
    if(!response.ok)throw new Error("Erreur API");

    const result=await response.json();
    const articles=result.data||[];
    container.innerHTML="";

    articles.forEach(article=>{
      const item=document.createElement("article");
      const title=document.createElement("h3");
      title.textContent=article.title||"Actualité";

      const excerpt=document.createElement("p");
      excerpt.textContent=article.excerpt||"";

      item.append(title,excerpt);

      if(article.url){
        const link=document.createElement("a");
        link.href=article.url;
        link.target="_blank";
        link.rel="noopener noreferrer";
        link.textContent="Lire l'article";
        item.appendChild(link);
      }

      container.appendChild(item);
    });

    if(!articles.length)container.textContent="Aucune actualité disponible.";
  }catch(error){
    container.textContent="Impossible de charger les actualités.";
  }
}

loadCatalog();
</script>
</body>
</html>
