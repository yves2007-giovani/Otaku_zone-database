<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>OTAKU_ZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{background:#111;padding:15px;border-bottom:1px solid #d4af37;position:sticky;top:0;z-index:2}
h1,.gold{color:#d4af37}
input{width:100%;padding:12px;background:#222;color:white;border:1px solid #555;border-radius:8px;margin-top:10px}
nav{display:flex;gap:8px;overflow:auto;margin-top:12px}
button{padding:10px;border:1px solid #d4af37;border-radius:7px;background:#191919;color:#d4af37}
main{padding:15px;max-width:1100px;margin:auto}
.page{display:none}.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
.card{background:#171717;border:1px solid #333;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover}
.card h3{font-size:14px;padding:0 8px}
.small{font-size:12px;color:#aaa;padding:0 8px}
.box{background:#151515;padding:12px;margin:12px 0;border-radius:8px}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.ep{color:white;border-color:#444}
.ep.active{background:#d4af37;color:#000}
iframe{width:100%;aspect-ratio:16/9;border:1px solid #d4af37;background:#000}
.msg{padding:15px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>OTAKU_ZONE</h1>
<input id="search" placeholder="Rechercher un anime...">
<nav>
<button onclick="show('home')">Accueil</button>
<button onclick="show('catalog')">Catalogue</button>
<button onclick="show('favorites')">Favoris</button>
</nav>
</header>
<main>
<section id="home" class="page active">
<h2 class="gold">Animes populaires</h2>
<div id="popular" class="grid"><p class="msg">Chargement...</p></div>
</section>
<section id="catalog" class="page">
<h2 class="gold">Catalogue</h2>
<div id="results" class="grid"></div>
</section>
<section id="detail" class="page">
<button onclick="show('catalog')">← Retour</button>
<div id="details"></div>
</section>
<section id="favorites" class="page">
<h2 class="gold">Mes favoris</h2>
<div id="fav" class="grid"></div>
</section>
</main>

<script>
const API="https://graphql.anilist.co";
const DB="https://raw.githubusercontent.com/yves2007-giovani/Otaku_zone-database/main/episodes.json";
const $=id=>document.getElementById(id);
let animeList=[],database=[],current=null,back="home";

function show(id){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
$(id).classList.add("active");
if(id==="favorites")renderFavorites();
window.scrollTo(0,0);
}
function title(a){return a.title?.userPreferred||a.title?.english||a.title?.romaji||a.title||"Anime"}
function cover(a){return a.coverImage?.large||a.image||"https://placehold.co/300x400/111/D4AF37?text=Anime"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function gql(query,variables={}){
const r=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify({query,variables})
});
if(!r.ok)throw Error("API indisponible");
const j=await r.json();
if(j.errors)throw Error("Erreur API");
return j.data;
}

function card(a){
return `<article class="card" onclick="openAnime(${Number(a.id)})">
<img loading="lazy" src="${esc(cover(a))}">
<h3>${esc(title(a))}</h3>
<p class="small">${esc(a.format||"ANIME")} ${a.episodes?"· "+a.episodes+" épisodes":""}</p>
</article>`;
}

async function loadPopular(){
try{
const d=await gql(`query{
Page(page:1,perPage:24){
media(type:ANIME,sort:TRENDING_DESC){
id title{romaji english userPreferred}
coverImage{large} format episodes description(asHtml:false)
}
}
}`);
animeList=d.Page.media;
$("popular").innerHTML=animeList.map(card).join("");
}catch(e){
$("popular").innerHTML='<p class="msg">Impossible de charger le catalogue. Vérifie la connexion.</p>';
}
}

async function loadDatabase(){
try{
const r=await fetch(DB+"?t="+Date.now());
const d=await r.json();
database=Array.isArray(d)?d:(d.animes||[]);
}catch(e){database=[]}
}

async function searchAnime(q){
show("catalog");
$("results").innerHTML='<p class="msg">Recherche...</p>';
try{
const d=await gql(`query($s:String){
Page(page:1,perPage:30){
media(search:$s,type:ANIME,sort:SEARCH_MATCH){
id title{romaji english userPreferred}
coverImage{large} format episodes description(asHtml:false)
}
}
}`,{s:q});
animeList.push(...d.Page.media);
$("results").innerHTML=d.Page.media.length?
d.Page.media.map(card).join(""):'<p class="msg">Aucun résultat.</p>';
}catch(e){
$("results").innerHTML='<p class="msg">Recherche indisponible.</p>';
}
}

$("search").addEventListener("keydown",e=>{
if(e.key==="Enter"&&e.target.value.trim())searchAnime(e.target.value.trim());
});

function findLocal(a){
return database.find(x=>
String(x.anilistId||x.id)===String(a.id)||
String(x.title||x.name||"").toLowerCase()===title(a).toLowerCase()
);
}

function openAnime(id){
const a=animeList.find(x=>Number(x.id)===Number(id));
if(!a)return;
back=document.querySelector(".page.active").id;
current=a;
const local=findLocal(a);
const seasons=local?.seasons||[];
let seasonHTML="";

if(seasons.length){
seasonHTML=seasons.map((s,i)=>`
<div class="box">
<h3 class="gold">${esc(s.title||"Saison "+(s.number||i+1))}</h3>
<div class="episodes">
${(s.episodes||[]).map((ep,j)=>`
<button class="ep" onclick="playEpisode(${i},${j},this)">
Épisode ${esc(ep.number??j+1)}
</button>`).join("")}
</div>
</div>`).join("");
}else{
seasonHTML=`<div class="box">
<p>Aucun lien d'épisode enregistré pour cet anime.</p>
<p>Nombre total annoncé par AniList : ${esc(a.episodes||"inconnu")}</p>
<p class="small">AniList fournit le nombre d'épisodes, pas les liens vidéo.</p>
</div>`;
}

$("details").innerHTML=`
<h1>${esc(title(a))}</h1>
<img src="${esc(cover(a))}" style="width:130px;max-height:190px;object-fit:cover">
<p>${esc(a.description||"")}</p>
<div class="box">
<h3 class="gold">Lecteur vidéo Uqload</h3>
<p id="playerStatus">Sélectionne un épisode.</p>
<iframe id="player" src="about:blank" allowfullscreen></iframe>
<button id="external" style="display:none" onclick="window.open(window.videoURL,'_blank')">Ouvrir la vidéo</button>
</div>
<h2 class="gold">Saisons et épisodes</h2>${seasonHTML}`;
show("detail");
}

function playEpisode(si,ei,btn){
const local=findLocal(current);
const ep=local?.seasons?.[si]?.episodes?.[ei];
if(!ep){alert("Épisode introuvable.");return}
const url=ep.embedUrl||ep.embed_url||ep.url||ep.vf||ep.vostfr||ep.sourceUrl;
if(!url){alert("Lien Uqload manquant dans episodes.json.");return}
window.videoURL=url;
$("player").src=url;
$("playerStatus").textContent="Saison "+(si+1)+" · Épisode "+(ep.number||ei+1);
$("external").style.display="inline-block";
document.querySelectorAll(".ep").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
}

function getFavs(){
try{return JSON.parse(localStorage.getItem("oz_favs")||"[]")}catch(e){return[]}
}
function toggleFavorite(id){
let f=getFavs();
f=f.includes(id)?f.filter(x=>x!==id):[...f,id];
localStorage.setItem("oz_favs",JSON.stringify(f));
renderFavorites();
}
function renderFavorites(){
const ids=getFavs();
const list=animeList.filter(a=>ids.includes(a.id));
$("fav").innerHTML=list.map(card).join("")||'<p class="msg">Aucun favori.</p>';
}

async function init(){
await loadDatabase();
await loadPopular();
}
init();
</script>
</body>
</html>
