<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0614">
<title>Otaku_zone</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0B0614;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 16px;
  background: #160D25;
  border-bottom: 2px solid #8B5CF6;
}

header h1 {
  margin: 0;
  color: #A78BFA;
}

header p {
  color: #D8B4FE;
}

main {
  padding: 16px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #8B5CF6;
  border-radius: 10px;
  background: #1A1029;
  color: white;
  font-size: 16px;
}

h2 {
  color: #C4B5FD;
}

.catalogue {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.card {
  background: #1A1029;
  border: 1px solid #382454;
  border-radius: 12px;
  overflow: hidden;
}

.poster {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #492078, #160D25);
  font-size: 42px;
}

.info {
  padding: 12px;
}

.info h3 {
  font-size: 16px;
}

.info p {
  color: #C4B5FD;
  font-size: 13px;
}

button, .watch {
  display: block;
  width: 100%;
  padding: 11px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #8B5CF6;
  color: white;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
}

#details {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #1A1029;
  border: 1px solid #8B5CF6;
  border-radius: 12px;
}

.season {
  margin: 12px 0;
  padding: 12px;
  background: #28163C;
  border-radius: 10px;
}

.episode {
  padding: 10px 0;
  border-top: 1px solid #49305F;
}

#message {
  color: #D8B4FE;
}

footer {
  padding: 25px;
  text-align: center;
  color: #A78BFA;
}
</style>
</head>

<body>

<header>
  <h1>Otaku_zone 💜</h1>
  <p>Ton univers anime</p>
</header>

<main>
  <input id="search"
         placeholder="Rechercher un animé..."
         oninput="renderCatalogue()">

  <h2>🔥 Catalogue</h2>
  <p id="message">Chargement des animés...</p>
  <div id="catalogue" class="catalogue"></div>

  <section id="details">
    <button onclick="closeDetails()">← Retour au catalogue</button>
    <h2 id="animeTitle"></h2>
    <p id="animeDescription"></p>
    <div id="seasons"></div>
  </section>
</main>

<footer>Otaku_zone · Noir & violet 💜</footer>

<script>
let animes = [];

async function loadCatalogue() {
  const message = document.getElementById("message");

  try {
    const response = await fetch("./episodes.json");

    if (!response.ok) {
      throw new Error("Fichier JSON introuvable");
    }

    const data = await response.json();
    animes = data.animes || [];

    if (!animes.length && data.seasons) {
      animes = [{
        id: 1,
        title: "Catalogue",
        description: "Animés disponibles",
        seasons: data.seasons
      }];
    }

    message.textContent = animes.length
      ? ""
      : "Aucun animé dans episodes.json.";

    renderCatalogue();
  } catch (error) {
    message.textContent =
      "Impossible de charger episodes.json. Vérifie le fichier GitHub.";
  }
}

function renderCatalogue() {
  const query = document.getElementById("search")
    .value.toLowerCase();

  const filtered = animes.filter(anime =>
    (anime.title || "").toLowerCase().includes(query)
  );

  document.getElementById("catalogue").innerHTML =
    filtered.map((anime, index) => `
      <article class="card">
        <div class="poster">🎬</div>
        <div class="info">
          <h3>${escapeHTML(anime.title || "Animé")}</h3>
          <p>${escapeHTML(anime.description || "")}</p>
          <button onclick="openDetails(${index})">
            Découvrir
          </button>
        </div>
      </article>
    `).join("");

  window.filteredAnimes = filtered;
}

function openDetails(index) {
  const anime = window.filteredAnimes[index];
  if (!anime) return;

  document.getElementById("details").style.display = "block";
  document.getElementById("animeTitle").textContent = anime.title || "";
  document.getElementById("animeDescription").textContent =
    anime.description || "";

  const container = document.getElementById("seasons");
  const seasons = anime.seasons || [];

  if (!seasons.length) {
    container.innerHTML =
      "<p>Aucune saison ajoutée pour le moment.</p>";
  } else {
    container.innerHTML = seasons.map((season, i) => {
      const episodes = season.episodes || [];

      return `
        <div class="season">
          <h3>${escapeHTML(
            season.name || season.title || "Saison " + (i + 1)
          )}</h3>
          ${episodes.length ? episodes.map((episode, j) => `
            <div class="episode">
              <p>${escapeHTML(
                episode.title || "Épisode " + (episode.number || j + 1)
              )}</p>
              ${episode.url && safeURL(episode.url)
                ? `<a class="watch"
                    href="${escapeHTML(episode.url)}"
                    target="_blank"
                    rel="noopener noreferrer">▶ Regarder</a>`
                : "<p>Lien vidéo non disponible.</p>"
              }
            </div>
          `).join("") : "<p>Aucun épisode ajouté.</p>"}
        </div>
      `;
    }).join("");
  }

  document.getElementById("details").scrollIntoView({
    behavior: "smooth"
  });
}

function closeDetails() {
  document.getElementById("details").style.display = "none";
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:";
  } catch {
    return false;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

loadCatalogue();
</script>

</body>
</html>
